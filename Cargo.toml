[package]
name = "VM-PrintService"
version = "0.1.4"
edition = "2024"
authors = ["Henrik Mertens <henrik@mertens.digital>"]
description = "VM Print Service"
license = "GPL-3.0"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
self_update = { version = "0.42", default-features = false, features = ["rustls", "compression-flate2", "compression-zip-deflate", "archive-tar", "archive-zip"] }
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
tempfile = "3"
futures-util = "0.3"
printers = "2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[package.metadata.deb]
maintainer = "Henrik Mertens <henrik@mertens.digital>"
depends = "libcups2"
section = "utility"
priority = "optional"
assets = [
    ["target/release/VM-PrintService", "usr/local/bin/vm-printservice", "755"],
    ["vm-printservice.service", "etc/systemd/system/vm-printservice.service", "644"],
]

[package.metadata.wix]
upgrade-guid = "9CC6749F-2345-46A9-9EDC-72498A7025F5"
path-guid = "67C85A01-6AED-43A9-96F8-6781CD480A05"
frguid = "E8BA73FB-7E96-4CDD-8C60-79450CFC540F"
install-to = "ProgramFiles64Folder"
